# Postgres for running xoxn on your machine. Matches DATABASE_URI in .env.example:
#   postgresql://postgres:postgres@127.0.0.1:5432/xoxn
#
#   docker compose up -d     # start
#   docker compose down      # stop (data kept in the named volume)
#   docker compose down -v   # stop and wipe the database
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xoxn
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d xoxn']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
